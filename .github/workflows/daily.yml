name: Daily LinkedIn post

# Runs every morning automatically, plus a manual "Run workflow" button.
on:
  workflow_dispatch:        # manual button (kept for on-demand test runs)
    inputs:
      dry_run:
        description: "Dry run (prepare + commit image, but do NOT publish to Buffer)"
        type: boolean
        default: true
  # AUTOMATIC DAILY SCHEDULE re-enabled on 2026-06-29 (owner request): post the
  # daily card every day at 17:15 Paris. GitHub cron is UTC and only fires from
  # the DEFAULT branch (main). 15:15 UTC = 17:15 in summer (CEST) / 16:15 in
  # winter (CET) — the usual 1 h DST drift, accepted. Minute :15 (off the hour)
  # for reliability. The manual "Run workflow" button is kept above.
  schedule:
    - cron: "15 15 * * *"   # 15:15 UTC = 17:15 Paris (summer); 16:15 (winter)

permissions:
  contents: write           # to commit the daily card so it gets a public URL

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts for the card
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu fonts-dejavu-extra

      - name: Install dependencies
        run: pip install anthropic pillow

      - name: Run the brain (select + image + caption)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          BRANDFETCH_API_KEY: ${{ secrets.BRANDFETCH_API_KEY }}   # square brand icons
          LOGODEV_TOKEN: ${{ secrets.LOGODEV_TOKEN }}             # optional fallback
        run: python daily_post.py

      - name: Publish the card image to the repo (public URL)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cards
          git commit -m "Daily card $(date -u +%F)" || echo "nothing to commit"
          git push || echo "nothing to push"

      - name: Publish to LinkedIn via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}   # optional pin; defaults to prepz-fy
          # Manual runs default to a dry run; uncheck to actually publish.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python publish.py

      - name: Upload the generated card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-card
          path: card.png
          if-no-files-found: ignore
