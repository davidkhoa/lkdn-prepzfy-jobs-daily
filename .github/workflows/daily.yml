name: Daily LinkedIn post

# For now: a manual "Run workflow" button only.
# We'll add the every-morning schedule at step 5.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts for the card
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu fonts-dejavu-extra fonts-liberation

      - name: Install dependencies
        run: pip install anthropic pillow

      - name: Run the brain
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          LOGODEV_TOKEN: ${{ secrets.LOGODEV_TOKEN }}   # optional, sharper logos
        run: python daily_post.py

      - name: Upload the generated card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-card
          path: card.png
          if-no-files-found: ignore
