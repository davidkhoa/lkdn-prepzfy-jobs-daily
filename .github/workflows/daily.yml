name: Daily LinkedIn post

# Runs every morning automatically, plus a manual "Run workflow" button.
on:
  workflow_dispatch:        # manual button (kept for on-demand test runs)
    inputs:
      dry_run:
        description: "Dry run (prepare + commit image, but do NOT publish to Buffer)"
        type: boolean
        default: true
  # AUTOMATIC DAILY SCHEDULE (owner request 2026-06-29): the post must go LIVE at
  # 17:15 Paris every day. GitHub's cron is notoriously LATE (observed firing 2-3 h
  # after the target), so we do NOT use it to time the post. Instead this workflow
  # runs in the MORNING just to PREPARE the card, and publish.py tells Buffer to
  # publish at exactly 17:15 Europe/Paris (POST_TIME_PARIS, DST-safe). So even if
  # GitHub fires this late, the card is ready before 17:15 and Buffer releases it
  # on time. Target ~13:00 Paris (owner updates the LINKFIN job board around midday,
  # so the prep must run AFTER that to read fresh offers). GitHub cron never fires
  # EARLY, only on-time or late, so a 13:00 target always sees the updated board and
  # still lands before 17:15 even with the usual 2-3 h lag. Not later (e.g. 14:00):
  # the lag could push the run past 17:00 and miss the publish window.
  # Cron only fires from the DEFAULT branch (main). Manual "Run workflow" kept above.
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 13:00 Paris (summer) / 12:00 (winter); before 17:15 publish

permissions:
  contents: write           # to commit the daily card so it gets a public URL

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts for the card
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu fonts-dejavu-extra

      - name: Install dependencies
        run: pip install anthropic pillow tzdata   # tzdata: lets publish.py resolve Europe/Paris

      - name: Run the brain (select + image + caption)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          BRANDFETCH_API_KEY: ${{ secrets.BRANDFETCH_API_KEY }}   # square brand icons
          LOGODEV_TOKEN: ${{ secrets.LOGODEV_TOKEN }}             # optional fallback
        run: python daily_post.py

      - name: Publish the card image to the repo (public URL)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cards
          git commit -m "Daily card $(date -u +%F)" || echo "nothing to commit"
          git push || echo "nothing to push"

      - name: Publish to LinkedIn via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}   # optional pin; defaults to prepz-fy
          # Manual runs default to a dry run; uncheck to actually publish.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python publish.py

      - name: Upload the generated card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-card
          path: card.png
          if-no-files-found: ignore
